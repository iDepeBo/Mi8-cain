<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ми-8 CAIN</title>
    <!-- Ссылки на файлы в корне папки -->
    <link rel="stylesheet" href="leaflet.css" />
    <link rel="stylesheet" href="style.css" />
    <!-- Библиотека карты -->
    <script src="leaflet.js"></script>
</head>
<body style="margin: 0; padding: 0; overflow: hidden; background: #000;">

    <!-- 1. Контейнер карты (занимает весь экран) -->
<div id="map" style="width: calc(100% - 310px); height: 100vh; float: left;"></div>

    <!-- 2. Правая панель-подложка (Фиксированная справа) -->
<div id="side-panel" style="width: 310px; height: 100vh; float: right; background: #1e272e; padding: 15px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; z-index: 9999; box-shadow: -2px 0 10px rgba(0,0,0,0.5); border-left: 1px solid #34495e; overflow-y: auto;">

        <!-- Заголовок и Кнопка ALL -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
            <h1 style="margin: 0; font-size: 18px; color: #1abc9c; font-family: sans-serif;">Ми-8 "CAIN"</h1>
            <button onclick="resetAll()" style="background: #e74c3c; color: white; border: none; padding: 4px 10px; font-size: 10px; font-weight: bold; border-radius: 4px; cursor: pointer;">ALL</button>
    </div>

        <!-- Блок высоты вертолета -->
    <div class="input-block" style="border-bottom: 1px solid #34495e; padding-bottom: 10px;">
        <label style="color: rgba(255,255,255,0.7); font-size: 11px; text-transform: uppercase; letter-spacing: 1px;">Высота вертолета (м):</label>
        <div style="display: flex; gap: 8px; margin-top: 5px; align-items: center;">
            <input type="number" id="hHeli" value="100" oninput="calculateBallistics()" style="width: 70px; height: 40px; background: #2c3e50; color: white; border: 1px solid #1abc9c; border-radius: 4px; padding: 5px; font-size: 16px; text-align: center;">
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 3px; flex-grow: 1;">
                <button onclick="changeVal('hHeli', 100)" style="font-size: 10px; padding: 4px 0; background: #34495e; color: white; border: none; border-radius: 2px; cursor: pointer;">+100</button>
                <button onclick="changeVal('hHeli', 50)" style="font-size: 10px; padding: 4px 0; background: #34495e; color: white; border: none; border-radius: 2px; cursor: pointer;">+50</button>
                <button onclick="changeVal('hHeli', 5)" style="font-size: 10px; padding: 4px 0; background: #34495e; color: white; border: none; border-radius: 2px; cursor: pointer;">+5</button>
                <button onclick="changeVal('hHeli', -100)" style="font-size: 10px; padding: 4px 0; background: #34495e; color: white; border: none; border-radius: 2px; cursor: pointer;">-100</button>
                <button onclick="changeVal('hHeli', -50)" style="font-size: 10px; padding: 4px 0; background: #34495e; color: white; border: none; border-radius: 2px; cursor: pointer;">-50</button>
                <button onclick="changeVal('hHeli', -5)" style="font-size: 10px; padding: 4px 0; background: #34495e; color: white; border: none; border-radius: 2px; cursor: pointer;">-5</button>
            </div>
        </div>
    </div>

    <!-- Блок высоты цели -->
    <div class="input-block" style="border-bottom: 1px solid #34495e; padding-bottom: 10px;">
        <label style="color: rgba(255,255,255,0.7); font-size: 11px; text-transform: uppercase; letter-spacing: 1px;">Высота цели (м):</label>
        <div style="display: flex; gap: 8px; margin-top: 5px; align-items: center;">
            <input type="number" id="hTarget" value="0" oninput="calculateBallistics()" style="width: 70px; height: 40px; background: #2c3e50; color: white; border: 1px solid #3498db; border-radius: 4px; padding: 5px; font-size: 16px; text-align: center;">
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 3px; flex-grow: 1;">
                <button onclick="changeVal('hTarget', 20)" style="font-size: 10px; padding: 4px 0; background: #34495e; color: white; border: none; border-radius: 2px; cursor: pointer;">+20</button>
                <button onclick="changeVal('hTarget', 5)" style="font-size: 10px; padding: 4px 0; background: #34495e; color: white; border: none; border-radius: 2px; cursor: pointer;">+5</button>
                <div style="background: transparent;"></div> <!-- Заглушка -->
                <button onclick="changeVal('hTarget', -20)" style="font-size: 10px; padding: 4px 0; background: #34495e; color: white; border: none; border-radius: 2px; cursor: pointer;">-20</button>
                <button onclick="changeVal('hTarget', -5)" style="font-size: 10px; padding: 4px 0; background: #34495e; color: white; border: none; border-radius: 2px; cursor: pointer;">-5</button>
            </div>
        </div>
    </div>

    <!-- Зеленое поле РЕЗУЛЬТАТА с ГАЛОЧКОЙ -->
    <div id="output" style="display: flex; align-items: center; gap: 12px; background: #1abc9c; color: white; padding: 12px; border-radius: 4px; min-height: 54px; position: relative; margin-top: 5px;">
        <!-- Кнопка-галочка (Авто-коррекция) -->
        <button onclick="applyCorrection()" style="width: 34px; height: 34px; border-radius: 50%; border: 2px solid white; background: rgba(255,255,255,0.2); color: white; cursor: pointer; font-weight: bold; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 20px;">✓</button>
        
        <!-- Сюда JS пишет дистанцию и результат -->
        <div id="outputText" style="font-size: 13px; line-height: 1.3; font-weight: bold;">
            1. Клик на Ми-8<br>2. Клик на цель
        </div>
    </div>

    <!-- Синее поле КУРСА -->
    <div id="courseInfo" style="background: #3498db; color: white; padding: 10px 15px; border-radius: 4px; font-size: 14px; font-weight: bold;">
        Курс на цель: --°
    </div>

    <!-- Кнопка СБРОСИТЬ ТОЛЬКО ПОЗИЦИИ -->
    <button onclick="resetMarkers()" style="background: #e74c3c; color: white; border: none; padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px; width: 100%;">
        СБРОСИТЬ ПОЗИЦИИ
    </button>

    <!-- 6. Черный экран баллистики (в самом низу панели) -->
    <div style="background: black; border-radius: 4px; overflow: hidden; margin-top: auto; border: 1px solid #34495e;">
        <canvas id="trajCanvas" width="280" height="150" style="display: block;"></canvas>
    </div>

</div> <!-- Закрытие side-panel -->

<!-- ЛИНЕЙКА (плавающая кнопка в углу карты) -->
<button onclick="toggleRuler()" style="position: fixed; bottom: 20px; right: 330px; z-index: 9998; padding: 10px 15px; background: rgba(26, 188, 156, 0.8); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-family: sans-serif;">ЛИНЕЙКА (1 км)</button>

<!-- СКРИПТЫ (подключаем в самом конце) -->
<script src="leaflet.js"></script>
<script src="map-engine.js"></script>
<script src="ballistics.js"></script>

</div>
</body>
</html>
